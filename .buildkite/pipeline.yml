steps:
  - label: ":docker: Build cloudreve"
    if_changed:
      - ".build/**"
      - ".goreleaser.yaml"
      - "application/**"
      - "assets/**"
      - "cmd/**"
      - "ent/**"
      - "go.mod"
      - "go.sum"
      - "inventory/**"
      - "main.go"
      - "middleware/**"
      - "mise.toml"
      - "pkg/**"
      - "routers/**"
      - "service/**"
      - "Dockerfile"
      - "docker-bake.hcl"
      - ".buildkite/pipeline.yml"
    agents: { queue: home-infra }
    command: |
      set -euo pipefail
      COMMIT="${BUILDKITE_COMMIT:0:7}" docker buildx bake cloudreve-amd64
    plugins:
      - kubernetes:
          podTemplate: buildkit
